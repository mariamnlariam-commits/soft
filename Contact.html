<html> 

<section id="contact" class="contact">
  <form id="regForm" action="https://formspree.io/f/xyzlwred" method="POST">

    <h1>Contact Us</h1>

    <div class="tab">Name:
      <p><input name="first_name" placeholder="First name..." required></p>
      <p><input name="last_name" placeholder="Last name..." required></p>
    </div>

    <div class="tab">Contact Info:
      <p><input type="email" name="email" placeholder="E-mail..." required></p>
      <p><input type="tel" name="phone" placeholder="Phone..." required></p>
    </div>

    <div class="tab">Birthday:
      <p><input name="day" placeholder="dd" required></p>
      <p><input name="month" placeholder="mm" required></p>
      <p><input name="year" placeholder="yyyy" required></p>
    </div>

    <div class="tab">Description:
      <p><textarea id="w3review" name="w3review" rows="4" cols="50" placeholder="Description..." required></textarea></p>
    </div>

    <div style="overflow:auto;">
      <div style="float:right;">
        <button type="button" id="prevBtn" onclick="nextPrev(-1)">Previous</button>
        <button type="button" id="nextBtn" onclick="nextPrev(1)">Next</button>
      </div>
    </div>

    <div style="text-align:center;margin-top:30px;">
      <span class="step"></span>
      <span class="step"></span>
      <span class="step"></span>
      <span class="step"></span>
    </div>
  </form>
</section>
    
<script src="script.js"></script>
</body>
</html>
